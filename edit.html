<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>料金表の編集 | 株式会社ファディー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #1c1c1c;
      --muted: #6f6b64;
      --green: #1b4a3a;
      --line: #ddd7cc;
      --card: #fffcf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", "Yu Gothic", "Meiryo", sans-serif;
      line-height: 1.7;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      padding: 12px 22px;
      background: var(--green);
      color: #f7f4ee;
    }
    .bar p { margin: 0; font-size: 14px; letter-spacing: 0.04em; }
    .bar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .bar a { color: #f7f4ee; font-size: 14px; }
    .bar button, .token-panel button {
      padding: 8px 14px;
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .bar .quiet, .token-panel .quiet {
      background: transparent;
      color: inherit;
      border: 1px solid rgba(247, 244, 238, 0.55);
    }
    .token-panel .quiet { color: var(--green); border-color: var(--green); }
    .go {
      border: 0;
      background: #fffcf8;
      color: var(--green);
      font-weight: 700;
    }
    .bar-note {
      flex-basis: 100%;
      margin: 0;
      color: #f3efe4;
      font-size: 13px;
    }
    .bar-note:empty { display: none; }
    .bar-note.error { color: #ffd2c8; }
    .hint {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 16px 28px 0;
      color: #3a3834;
      font-size: 14px;
    }
    .hint p { margin: 0; }
    .hint nav { display: flex; gap: 16px; margin-top: 6px; }
    .hint a { color: var(--green); font-weight: 500; }
    .token-panel {
      width: min(920px, calc(100% - 44px));
      margin: 12px auto 0;
      padding: 16px 18px 18px;
      background: var(--card);
      border: 1px solid #ebe4d8;
      border-radius: 8px;
    }
    .token-panel p { margin: 0; color: var(--muted); font-size: 13px; }
    .token-panel label { display: block; margin-top: 12px; font-size: 14px; font-weight: 500; }
    .token-panel input {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }
    #stage { min-height: 40vh; }
    #stage .loading { width: min(920px, 100%); margin: 0 auto; padding: 28px; }
  </style>
  <style id="overrides">
    body.editing .table-wrap { display: block; }
    body.editing .cards { display: none; }
    body.editing .menu-block { scroll-margin-top: 72px; }
    body.editing .table-wrap table { min-width: 760px; }
    body.editing #stage tbody th,
    body.editing #stage tbody td { vertical-align: top; }
    body.editing #stage thead th:nth-child(2),
    body.editing #stage td.duration { white-space: nowrap; }
    #stage .video-slot {
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-areas: "label open" "input input";
      align-items: center;
      gap: 2px 10px;
      margin-top: 8px;
    }
    #stage .video-label {
      grid-area: label;
      color: var(--green);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    #stage .video-slot input,
    #stage .name-input,
    #stage .desc-input,
    #stage .duration-input,
    #stage .price-input {
      width: 100%;
      border: 0;
      border-bottom: 1px dashed rgba(27, 74, 58, 0.45);
      background: transparent;
      color: inherit;
      font: inherit;
      border-radius: 0;
      padding: 2px 0;
    }
    #stage .video-slot input { grid-area: input; font-size: 14px; font-weight: 400; }
    #stage .video-slot .sample { grid-area: open; margin-top: 0; white-space: nowrap; }
    #stage .video-slot .sample[hidden] { display: none; }
    #stage .name-input { display: block; font-size: 17px; font-weight: 700; }
    #stage .desc-input { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; font-weight: 400; }
    #stage .duration-input { font-size: 15px; }
    #stage .price-input { font-size: 24px; font-weight: 700; text-align: right; }
    #stage input:focus {
      outline: none;
      border-bottom-style: solid;
      border-bottom-color: var(--green);
    }
    #stage input.bad { border-bottom-color: #8a3a2a; }
    #stage input::placeholder { color: #b7b1a6; font-weight: 400; }
    #stage .price-input::placeholder { font-size: 14px; }
    #stage tr.draft { background: #f7fbf8; }
    #stage .added-mark {
      margin: 0 0 4px;
      color: var(--green);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }
    #stage .row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 10px; }
    #stage .text-btn, #stage .add-video, #stage .do-add {
      font: inherit;
      cursor: pointer;
    }
    #stage .text-btn {
      padding: 0;
      border: 0;
      background: none;
      color: var(--green);
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    #stage .do-remove { color: var(--muted); }
    #stage .do-add {
      padding: 8px 14px;
      border: 0;
      border-radius: 6px;
      background: var(--green);
      color: #f7f4ee;
      font-size: 14px;
    }
    #stage .single-line { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
    #stage .single-line .price-input { width: 7em; flex: 0 0 auto; }
    #stage .note-select {
      width: auto;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
    }
    #stage .add-row td { border-bottom: 0; padding-top: 10px; }
    #stage .add-video {
      width: 100%;
      padding: 12px;
      border: 1px dashed var(--green);
      border-radius: 8px;
      background: transparent;
      color: var(--green);
      font-size: 15px;
    }
    #stage .add-video:hover, #stage .add-video:focus { background: #f7fbf8; }
    #stage tr[data-extra] .desc:empty {
      display: block;
      min-height: 1.5em;
    }
    #stage tr[data-extra] .desc:empty::before {
      content: "説明";
      color: #b7b1a6;
      font-weight: 400;
    }
    #stage .can-edit { cursor: text; border-radius: 4px; }
    #stage .can-edit:hover { box-shadow: inset 0 -1px 0 var(--green); }
    #stage .inline-edit {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--green);
      background: #fff;
      color: inherit;
      font: inherit;
      padding: 0;
    }
    #stage td.price .inline-edit { font-size: 24px; font-weight: 700; text-align: right; }
    #stage .row-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 6px; }
    #stage .grip { cursor: grab; color: var(--muted); font-size: 13px; }
    #stage tr.drop-target { outline: 2px solid var(--green); outline-offset: -2px; }
    @media (max-width: 700px) {
      body.editing .table-wrap { overflow: visible; }
      body.editing .table-wrap table,
      body.editing #stage tbody,
      body.editing #stage tbody tr,
      body.editing #stage tbody th,
      body.editing #stage tbody td {
        display: block;
        width: 100%;
        min-width: 0;
      }
      body.editing #stage thead { display: none; }
      body.editing #stage tbody tr {
        padding: 6px 0 14px;
        border-bottom: 1px solid var(--line);
      }
      body.editing #stage tr.add-row { border-bottom: 0; }
      body.editing #stage tbody th,
      body.editing #stage tbody td {
        padding: 6px 0;
        border-bottom: 0;
        text-align: left;
        white-space: normal;
      }
      body.editing #stage td.duration::before,
      body.editing #stage td.price::before {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.06em;
      }
      body.editing #stage td.duration::before { content: "尺の目安"; }
      body.editing #stage td.price:nth-child(3)::before { content: "インサートなし"; }
      body.editing #stage td.price:nth-child(4)::before { content: "インサートあり"; }
      body.editing #stage td.price[colspan="2"]::before { content: "料金"; }
      body.editing #stage .price-input,
      body.editing #stage td.price .inline-edit { text-align: left; }
      body.editing #stage .single-line { justify-content: flex-start; }
    }
  </style>
</head>
<body class="editing">
  <header class="bar">
    <p>料金表を直接編集</p>
    <div class="bar-actions">
      <button id="token-toggle" class="quiet" type="button">保存の設定</button>
      <a href="./" target="_blank" rel="noopener noreferrer">公開中の料金表</a>
      <button id="editor-publish" class="go" type="button">公開する</button>
    </div>
    <p id="editor-status" class="bar-note" role="status"></p>
    <p id="editor-dirty" class="bar-note"></p>
  </header>
  <div class="hint">
    <p>お客さまに見せる料金表です。タイトル、説明、尺、金額はダブルクリックで編集できます。金額には「応相談」などの日本語も入れられます。上へ・下へ、または「移動」のドラッグで並び替えられます。</p>
    <nav>
      <a href="#representative">代表</a>
      <a href="#staff">社員</a>
      <a href="#company">会社</a>
    </nav>
  </div>
  <form id="token-panel" class="token-panel" hidden>
    <p>トークンはこのブラウザだけに残ります。料金表のページには出ません。まだ無い場合は、<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">GitHubでトークンを作成</a>してください。対象リポジトリは recruit-video-menu、権限は Contents の Read and write です。</p>
    <label>トークン
      <input id="editor-token" type="password" autocomplete="off" placeholder="github_pat_...">
    </label>
    <button type="submit">このブラウザに保存</button>
    <button id="forget" class="quiet" type="button">保存したトークンを消す</button>
    <p id="token-state"></p>
  </form>
  <div id="stage"><p class="loading">料金表を読み込んでいます…</p></div>
  <script src="menu.js"></script>
  <script>
    var TOKEN_KEY = "fady-menu-token";
    var state = { videos: {}, items: [] };
    var tracked = {};
    var savedRaw = "";
    var publishing = false;

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function digits(value) {
      return String(value || "").replace(/[０-９]/g, function (ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 65248);
      }).trim();
    }

    function isPrice(value) {
      return /^\d+(?:\.\d+)?万円$/.test(MenuKit.yen(digits(value)));
    }

    function setStatus(message, isError) {
      var status = document.getElementById("editor-status");
      status.textContent = message;
      status.className = isError ? "bar-note error" : "bar-note";
    }

    function token() {
      return document.getElementById("editor-token").value.trim();
    }

    function rawSnapshot() {
      return JSON.stringify(collect());
    }

    function markDirty() {
      var dirty = rawSnapshot() !== savedRaw;
      document.getElementById("editor-dirty").textContent = dirty
        ? "まだ公開前です。公開すると、1分ほどで料金表のURLに反映されます。"
        : "";
    }

    function findRow(name) {
      var rows = document.querySelectorAll("#stage tbody tr");
      var i;
      for (i = 0; i < rows.length; i++) {
        if (rows[i].dataset.extra === "1" || rows[i].classList.contains("draft") || rows[i].classList.contains("add-row")) continue;
        var nameEl = rows[i].querySelector(".name");
        if (nameEl && nameEl.textContent.trim() === name) return rows[i];
      }
      return null;
    }

    function namesInUse(skipIndex) {
      var names = MenuKit.base.map(function (item) { return item.name; });
      state.items.forEach(function (item, index) {
        if (index === skipIndex) return;
        if (item.name) names.push(item.name.trim());
      });
      return names;
    }

    function validateItem(item, skipIndex) {
      if (!item.name) return "動画の名前を入力してください。";
      if (namesInUse(skipIndex).indexOf(item.name.trim()) !== -1) return "同じ名前の動画がすでにあります。";
      if (!item.duration) return "尺の目安を入力してください。";
      if (item.video && !MenuKit.safeUrl(item.video)) return "参考動画は https で始まるURLにしてください。";
      if (item.single) {
        if (!isPrice(item.single)) return "料金を入力してください。";
      } else if (!isPrice(item.interview) && !isPrice(item.workplace)) {
        return "料金をどちらか入力してください。空欄は対象外になります。";
      }
      return "";
    }

    function copyItem(item) {
      var copy = {
        category: item.category,
        name: item.name.trim(),
        description: (item.description || "").trim(),
        duration: (item.duration || "").trim(),
        video: MenuKit.safeUrl(item.video)
      };
      if (item.single) {
        copy.single = MenuKit.yen(digits(item.single));
        copy.note = item.note || "（一律）";
      } else {
        copy.interview = MenuKit.yen(digits(item.interview));
        copy.workplace = MenuKit.yen(digits(item.workplace));
      }
      return copy;
    }

    function buildPayload() {
      commitOpen();
      return collect();
    }

    function videoSlot(value, onInput) {
      var wrap = el("div", "video-slot");
      var label = el("span", "video-label", "参考動画");
      var input = el("input", "video-input");
      input.type = "url";
      input.placeholder = "URLを貼る";
      input.spellcheck = false;
      input.autocomplete = "off";
      input.setAttribute("aria-label", "参考動画のURL");
      input.value = value || "";
      var open = el("a", "sample", "開く");
      open.target = "_blank";
      open.rel = "noopener noreferrer";
      function syncLink() {
        var url = MenuKit.safeUrl(input.value);
        open.hidden = !url;
        if (url) open.href = url;
      }
      input.addEventListener("input", function () {
        input.classList.remove("bad");
        syncLink();
        if (onInput) onInput(input.value.trim());
      });
      input.addEventListener("blur", function () {
        input.classList.toggle("bad", !!(input.value.trim() && !MenuKit.safeUrl(input.value)));
      });
      syncLink();
      wrap.append(label, input, open);
      return wrap;
    }

    function textInput(className, value, placeholder, label) {
      var input = el("input", className);
      input.value = value || "";
      input.placeholder = placeholder;
      input.autocomplete = "off";
      input.setAttribute("aria-label", label);
      return input;
    }

    function readFields(tr) {
      function val(selector) {
        var node = tr.querySelector(selector);
        return node ? node.value.trim() : "";
      }
      var item = {
        category: tr.dataset.category,
        name: val(".name-input"),
        description: val(".desc-input"),
        duration: val(".duration-input"),
        video: val(".video-input")
      };
      if (tr.dataset.mode === "single") {
        item.single = val(".price-input");
        item.note = val(".note-select") || "（一律）";
      } else {
        var prices = tr.querySelectorAll(".price-input");
        item.interview = prices[0] ? prices[0].value.trim() : "";
        item.workplace = prices[1] ? prices[1].value.trim() : "";
      }
      return item;
    }

    function setSplit(item) {
      item.interview = item.single || item.interview || "";
      item.workplace = "";
      delete item.single;
      delete item.note;
      return item;
    }

    function setSingle(item) {
      var note = item.note || "（一律）";
      item.single = item.single || item.interview || item.workplace || "";
      item.note = note;
      delete item.interview;
      delete item.workplace;
      return item;
    }

    function appendPrices(tr, item) {
      if (item.single != null && tr.dataset.mode === "single") {
        var singleCell = el("td", "price");
        singleCell.colSpan = 2;
        var line = el("div", "single-line");
        var price = textInput("price-input", item.single, "25万円", "料金");
        price.inputMode = "numeric";
        var select = document.createElement("select");
        select.className = "note-select";
        select.setAttribute("aria-label", "料金の注記");
        ["（一律）", "（インサート込み）"].forEach(function (note) {
          var option = document.createElement("option");
          option.value = note;
          option.textContent = note;
          if ((item.note || "（一律）") === note) option.selected = true;
          select.append(option);
        });
        line.append(price, select);
        singleCell.append(line);
        tr.append(singleCell);
        return;
      }
      [
        [item.interview || "", "インサートなし"],
        [item.workplace || "", "インサートあり"]
      ].forEach(function (pair) {
        var cell = el("td", "price");
        var price = textInput("price-input", pair[0], "対象外", pair[1]);
        price.inputMode = "numeric";
        cell.append(price);
        tr.append(cell);
      });
    }

    function bindPrices(tr, sync) {
      tr.querySelectorAll(".price-input").forEach(function (input) {
        input.addEventListener("blur", function () {
          var formatted = MenuKit.yen(digits(input.value));
          if (input.value.trim()) input.value = formatted;
          if (sync) sync();
        });
      });
    }

    function rowShell(item, mode) {
      var tr = document.createElement("tr");
      tr.dataset.category = item.category;
      tr.dataset.mode = mode;
      var th = document.createElement("th");
      th.scope = "row";
      th.append(
        textInput("name-input", item.name, "動画の名前", "動画の名前"),
        textInput("desc-input", item.description || "", "説明", "説明"),
        videoSlot(item.video || "", null)
      );
      var duration = el("td", "duration");
      duration.append(textInput("duration-input", item.duration || "", "2〜3分", "尺の目安"));
      tr.append(th, duration);
      appendPrices(tr, item);
      return tr;
    }

    function placeActions(tr, actions) {
      var box = el("div", "row-actions");
      actions.forEach(function (action) { box.append(action); });
      tr.querySelector("th").append(box);
    }

    function button(className, text, onClick) {
      var node = el("button", className, text);
      node.type = "button";
      node.addEventListener("click", onClick);
      return node;
    }

    function appendExtra(item, index) {
      var tbody = document.querySelector("#" + item.category + " tbody");
      if (!tbody) return;
      var tr = rowShell(item, item.single != null ? "single" : "split");
      tr.dataset.extra = "1";
      tr.dataset.index = String(index);
      tr.querySelector("th").insertBefore(el("p", "added-mark", "追加した行"), tr.querySelector("th").firstChild);
      function sync() {
        state.items[Number(tr.dataset.index)] = readFields(tr);
        markDirty();
      }
      tr.querySelectorAll("input, select").forEach(function (node) {
        node.addEventListener("input", sync);
        node.addEventListener("change", sync);
      });
      bindPrices(tr, sync);
      placeActions(tr, [
        button("text-btn do-mode", tr.dataset.mode === "single" ? "2つの料金に戻す" : "料金を1つにする", function () {
          var current = readFields(tr);
          state.items[Number(tr.dataset.index)] = tr.dataset.mode === "single" ? setSplit(current) : setSingle(current);
          paint();
          markDirty();
        }),
        button("text-btn do-remove", "この行を消す", function () {
          state.items.splice(Number(tr.dataset.index), 1);
          paint();
          markDirty();
        })
      ]);
      tbody.append(tr);
    }

    function draftHasText(tr) {
      return Array.prototype.some.call(tr.querySelectorAll("input"), function (input) {
        return input.value.trim() !== "";
      });
    }

    function normalizeItem(item) {
      var copy = {
        category: item.category,
        name: item.name.trim(),
        description: (item.description || "").trim(),
        duration: (item.duration || "").trim(),
        video: (item.video || "").trim()
      };
      if (item.single != null) {
        copy.single = MenuKit.yen(digits(item.single));
        copy.note = item.note || "（一律）";
      } else {
        copy.interview = MenuKit.yen(digits(item.interview));
        copy.workplace = MenuKit.yen(digits(item.workplace));
      }
      return copy;
    }

    function openDraft(category) {
      var existing = document.querySelector("#stage tr.draft");
      if (existing) {
        if (existing.dataset.category === category) {
          existing.querySelector(".name-input").focus();
          return;
        }
        if (draftHasText(existing) && !window.confirm("入力中の行をやめますか？")) return;
        existing.remove();
      }
      var tr = rowShell({
        category: category,
        name: "",
        description: "",
        duration: "",
        interview: "",
        workplace: "",
        video: ""
      }, "split");
      tr.className = "draft";
      bindPrices(tr, null);
      placeDraftActions(tr);
      document.querySelector("#" + category + " tr.add-row").before(tr);
      tr.scrollIntoView({ block: "center" });
      tr.querySelector(".name-input").focus();
    }

    function placeDraftActions(tr) {
      placeActions(tr, [
        button("text-btn do-mode", tr.dataset.mode === "single" ? "2つの料金に戻す" : "料金を1つにする", function () {
          var current = readFields(tr);
          var next = tr.dataset.mode === "single" ? setSplit(current) : setSingle(current);
          var rebuilt = rowShell(next, next.single != null ? "single" : "split");
          rebuilt.className = "draft";
          bindPrices(rebuilt, null);
          placeDraftActions(rebuilt);
          tr.replaceWith(rebuilt);
          rebuilt.querySelector(".name-input").focus();
        }),
        button("do-add", "この行を入れる", function () {
          var item = normalizeItem(readFields(tr));
          var message = validateItem(item, -1);
          if (message) {
            setStatus(message, true);
            return;
          }
          state.items.push(item);
          paint();
          markDirty();
          setStatus("行を追加しました。公開すると料金表に出ます。", false);
        }),
        button("text-btn do-cancel", "やめる", function () {
          tr.remove();
          setStatus("", false);
        })
      ]);
    }

    function paint() {
      document.querySelectorAll("#stage tr[data-extra], #stage tr.draft, #stage tr.add-row").forEach(function (node) {
        node.remove();
      });
      state.items.forEach(appendExtra);
      ["representative", "staff", "company"].forEach(function (id) {
        var tbody = document.querySelector("#" + id + " tbody");
        if (!tbody) return;
        var tr = document.createElement("tr");
        tr.className = "add-row";
        var td = document.createElement("td");
        td.colSpan = 4;
        td.append(button("add-video", "＋ 動画を追加", function () { openDraft(id); }));
        tr.append(td);
        tbody.append(tr);
      });
    }

    function mountBase() {
      MenuKit.base.forEach(function (item) {
        var row = findRow(item.name);
        if (!row) return;
        var link = row.querySelector("a.sample");
        var initial = "";
        if (Object.prototype.hasOwnProperty.call(state.videos, item.name)) initial = state.videos[item.name];
        else if (link) {
          initial = link.href;
          state.videos[item.name] = link.href;
          tracked[item.name] = true;
        }
        if (link) link.remove();
        row.querySelector("th").append(videoSlot(initial, function (value) {
          state.videos[item.name] = value;
          if (value) tracked[item.name] = true;
          markDirty();
        }));
      });
    }

    function refreshBaseLinks() {
      MenuKit.base.forEach(function (item) {
        var row = findRow(item.name);
        if (!row) return;
        var input = row.querySelector(".video-input");
        var open = row.querySelector("a.sample");
        if (!input) return;
        input.value = state.videos[item.name] || "";
        var url = MenuKit.safeUrl(input.value);
        if (open) {
          open.hidden = !url;
          if (url) open.href = url;
        }
      });
    }

    function normalizeState() {
      state.items = state.items.map(copyItem);
      Object.keys(state.videos).forEach(function (name) {
        state.videos[name] = MenuKit.safeUrl(state.videos[name]);
      });
    }

    function toBase64(text) {
      var bytes = new TextEncoder().encode(text);
      var bin = "";
      bytes.forEach(function (byte) { bin += String.fromCharCode(byte); });
      return btoa(bin);
    }

    function validateAll() {
      commitOpen();
      var names = [];
      var message = "";
      eachMenuRow(function (tr) {
        if (message) return;
        var fields = readRow(tr);
        var video = (tr.querySelector(".video-input") || {}).value || "";
        video = video.trim();
        if (!fields.name) message = "動画の名前を入力してください。";
        else if (names.indexOf(fields.name) !== -1) message = "同じ名前の動画がすでにあります。";
        else if (!fields.duration) message = fields.name + "の尺を入力してください。";
        else if (video && !MenuKit.safeUrl(video)) message = fields.name + "の参考動画は https で始まるURLにしてください。";
        else names.push(fields.name);
      });
      return message;
    }

    document.getElementById("token-toggle").addEventListener("click", function () {
      var panel = document.getElementById("token-panel");
      panel.hidden = !panel.hidden;
      if (!panel.hidden) document.getElementById("editor-token").focus();
    });

    document.getElementById("token-panel").addEventListener("submit", function (event) {
      event.preventDefault();
      if (!token()) {
        setStatus("トークンを入力してください。", true);
        return;
      }
      localStorage.setItem(TOKEN_KEY, token());
      document.getElementById("token-state").textContent = "このブラウザに保存しました。";
      setStatus("", false);
    });

    document.getElementById("forget").addEventListener("click", function () {
      localStorage.removeItem(TOKEN_KEY);
      document.getElementById("editor-token").value = "";
      document.getElementById("token-state").textContent = "トークンを消しました。";
    });

    document.getElementById("editor-publish").addEventListener("click", function () {
      if (publishing) return;
      var message = validateAll();
      if (message) {
        setStatus(message, true);
        return;
      }
      var savedToken = localStorage.getItem(TOKEN_KEY) || token();
      if (!savedToken) {
        document.getElementById("token-panel").hidden = false;
        setStatus("先にトークンを保存してください。", true);
        document.getElementById("editor-token").focus();
        return;
      }
      publishing = true;
      setStatus("公開しています…", false);
      var api = "https://api.github.com/repos/ogawajimushoy-source/recruit-video-menu/contents/menu.json";
      var headers = {
        Accept: "application/vnd.github+json",
        Authorization: "Bearer " + savedToken,
        "X-GitHub-Api-Version": "2022-11-28"
      };
      fetch(api, { headers: headers, cache: "no-store" })
        .then(function (response) {
          if (response.status === 404) return "";
          if (!response.ok) throw new Error(String(response.status));
          return response.json().then(function (data) { return data.sha; });
        })
        .then(function (sha) {
          var body = {
            message: "Update the price list from the browser editor.",
            content: toBase64(JSON.stringify(buildPayload(), null, 2) + "\n")
          };
          if (sha) body.sha = sha;
          return fetch(api, {
            method: "PUT",
            headers: Object.assign({ "Content-Type": "application/json" }, headers),
            body: JSON.stringify(body)
          });
        })
        .then(function (response) {
          if (response.status === 401) throw new Error("トークンが違います。");
          if (response.status === 403) throw new Error("このトークンでは保存できません。Contents の書き込み権限を確認してください。");
          if (!response.ok) throw new Error("保存に失敗しました。");
          savedRaw = rawSnapshot();
          markDirty();
          setStatus("公開しました。1分ほどで料金表に反映されます。", false);
        })
        .catch(function (error) {
          setStatus(error.message || "保存に失敗しました。", true);
        })
        .then(function () { publishing = false; });
    });

    window.addEventListener("beforeunload", function (event) {
      if (rawSnapshot() !== savedRaw) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    var stored = localStorage.getItem(TOKEN_KEY) || "";
    if (stored) {
      document.getElementById("editor-token").value = stored;
      document.getElementById("token-state").textContent = "保存済みのトークンを使います。";
    } else {
      document.getElementById("token-panel").hidden = false;
    }

    function commitOpen() {
      var active = document.querySelector("#stage .inline-edit");
      if (active) active.blur();
    }

    function eachMenuRow(fn) {
      ["representative", "staff", "company"].forEach(function (category) {
        document.querySelectorAll("#" + category + " tbody tr[data-id]").forEach(function (tr) {
          fn(tr, category);
        });
      });
    }

    function readRow(tr) {
      var cells = [];
      Array.prototype.forEach.call(tr.children, function (child) {
        if (child.classList.contains("price")) cells.push(child);
      });
      var fields = {
        name: tr.querySelector(".name") ? tr.querySelector(".name").textContent.trim() : "",
        description: tr.querySelector(".desc") ? tr.querySelector(".desc").textContent.trim() : "",
        duration: tr.querySelector("td.duration") ? tr.querySelector("td.duration").textContent.trim() : ""
      };
      if (cells.length === 1) fields.single = cells[0].textContent.trim();
      else {
        fields.interview = cells[0] ? cells[0].textContent.trim() : "";
        fields.workplace = cells[1] ? cells[1].textContent.trim() : "";
      }
      return fields;
    }

    function priceValue(text) {
      return MenuKit.yen(text === "対象外" ? "" : text) || "対象外";
    }

    function collect() {
      var payload = {
        videos: {},
        items: [],
        order: { representative: [], staff: [], company: [] },
        overrides: {}
      };
      eachMenuRow(function (tr, category) {
        var id = tr.dataset.id;
        payload.order[category].push(id);
        var fields = readRow(tr);
        var video = (tr.querySelector(".video-input") || {}).value || "";
        video = video.trim();
        if (fields.single != null) fields.single = priceValue(fields.single);
        else {
          fields.interview = priceValue(fields.interview);
          fields.workplace = priceValue(fields.workplace);
        }
        if (tr.dataset.extra === "1") {
          var item = {
            id: id,
            category: category,
            name: fields.name,
            description: fields.description,
            duration: fields.duration,
            video: MenuKit.safeUrl(video)
          };
          if (fields.single != null) item.single = fields.single === "対象外" ? "" : fields.single;
          else {
            item.interview = fields.interview === "対象外" ? "" : fields.interview;
            item.workplace = fields.workplace === "対象外" ? "" : fields.workplace;
          }
          payload.items.push(item);
        } else {
          payload.overrides[id] = fields;
          if (video || tracked[id]) payload.videos[id] = MenuKit.safeUrl(video);
        }
      });
      return payload;
    }

    function syncCardOrder(section) {
      var cards = section.querySelector(".cards");
      if (!cards) return;
      section.querySelectorAll("tbody tr[data-id]").forEach(function (tr) {
        var card = null;
        cards.querySelectorAll("article[data-id]").forEach(function (node) {
          if (node.dataset.id === tr.dataset.id) card = node;
        });
        if (card) cards.appendChild(card);
      });
    }

    function moveRow(tr, direction) {
      var sibling = direction < 0 ? tr.previousElementSibling : tr.nextElementSibling;
      while (sibling && !sibling.dataset.id) {
        sibling = direction < 0 ? sibling.previousElementSibling : sibling.nextElementSibling;
      }
      if (!sibling) return;
      if (direction < 0) tr.parentElement.insertBefore(tr, sibling);
      else tr.parentElement.insertBefore(sibling, tr);
      syncCardOrder(tr.closest("section"));
      markDirty();
    }

    function beginEdit(element, kind) {
      if (!element || element.dataset.editing === "1") return;
      var original = element.textContent.trim();
      element.dataset.editing = "1";
      var input = document.createElement("input");
      input.type = "text";
      input.className = "inline-edit";
      input.value = kind === "price" && original === "対象外" ? "" : original;
      if (kind === "price") input.placeholder = "20万円、応相談など";
      if (kind === "desc") input.placeholder = "説明";
      if (kind === "name") input.placeholder = "動画の名前";
      if (kind === "duration") input.placeholder = "2〜3分";
      element.textContent = "";
      element.appendChild(input);
      input.focus();
      input.select();
      var done = false;
      function finish(save) {
        if (done) return;
        done = true;
        input.removeEventListener("blur", onBlur);
        var value = save ? input.value.trim() : original;
        if (save && kind === "name" && !value) {
          value = original;
          setStatus("動画の名前を入力してください。", true);
        }
        if (save && kind === "price") value = priceValue(value);
        delete element.dataset.editing;
        if (kind === "price") element.classList.toggle("na", value === "対象外");
        element.textContent = value;
        var tr = element.closest("tr");
        if (tr && save) syncCard(tr);
        if (save) markDirty();
      }
      function onBlur() { finish(true); }
      input.addEventListener("blur", onBlur);
      input.addEventListener("keydown", function (event) {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key === "Enter") {
          event.preventDefault();
          finish(true);
        }
        if (event.key === "Escape") {
          event.preventDefault();
          finish(false);
        }
      });
    }

    function syncCard(tr) {
      var section = tr.closest("section");
      if (!section) return;
      var card = null;
      section.querySelectorAll("article[data-id]").forEach(function (node) {
        if (node.dataset.id === tr.dataset.id) card = node;
      });
      if (!card) return;
      var fields = readRow(tr);
      var payload = { name: fields.name, description: fields.description, duration: fields.duration };
      if (fields.single != null) payload.single = fields.single;
      else {
        payload.interview = fields.interview;
        payload.workplace = fields.workplace;
      }
      var title = card.querySelector("h4");
      if (title) title.textContent = payload.name;
      var desc = card.querySelector(".desc");
      if (desc) desc.textContent = payload.description;
      var meta = card.querySelector(".meta");
      if (meta) meta.textContent = "動画の尺：" + payload.duration;
      var prices = card.querySelector(".card-prices");
      if (!prices) return;
      prices.textContent = "";
      function line(label, value) {
        var row = document.createElement("p");
        var span = document.createElement("span");
        span.textContent = label;
        var shown = MenuKit.showPrice(value);
        var strong = document.createElement("strong");
        if (shown.empty) strong.className = "na";
        strong.textContent = shown.text;
        row.append(span, strong);
        prices.append(row);
      }
      if (payload.single != null) line("料金", payload.single);
      else {
        line("インサートなし", payload.interview);
        line("インサートあり", payload.workplace);
      }
    }

    function bindEdit(element, kind) {
      if (!element) return;
      element.classList.add("can-edit");
      element.title = "ダブルクリックで編集";
      element.addEventListener("dblclick", function (event) {
        event.preventDefault();
        event.stopPropagation();
        beginEdit(element, kind);
      });
    }

    function enhanceRow(tr) {
      if (tr.dataset.ready === "1") return;
      tr.dataset.ready = "1";
      var th = tr.querySelector("th");
      var tools = el("div", "row-tools");
      var grip = el("span", "grip", "移動");
      grip.draggable = true;
      grip.title = "ドラッグで並び替え";
      tools.append(
        grip,
        button("text-btn move-up", "上へ", function () { moveRow(tr, -1); }),
        button("text-btn move-down", "下へ", function () { moveRow(tr, 1); })
      );
      if (tr.dataset.extra === "1") {
        tools.append(button("text-btn do-remove", "この行を消す", function () {
          var section = tr.closest("section");
          section.querySelectorAll("article[data-id]").forEach(function (node) {
            if (node.dataset.id === tr.dataset.id) node.remove();
          });
          tr.remove();
          markDirty();
        }));
      }
      th.insertBefore(tools, th.firstChild);
      bindEdit(tr.querySelector(".name"), "name");
      bindEdit(tr.querySelector(".desc"), "desc");
      bindEdit(tr.querySelector("td.duration"), "duration");
      Array.prototype.forEach.call(tr.children, function (child) {
        if (child.classList.contains("price")) bindEdit(child, "price");
      });
      var link = th.querySelector("a.sample");
      var initial = "";
      if (Object.prototype.hasOwnProperty.call(state.videos, tr.dataset.id)) initial = state.videos[tr.dataset.id] || "";
      else if (link) initial = link.href;
      if (initial) tracked[tr.dataset.id] = true;
      if (link) link.remove();
      th.append(videoSlot(initial, function (value) {
        state.videos[tr.dataset.id] = value;
        if (value) tracked[tr.dataset.id] = true;
        markDirty();
      }));
      grip.addEventListener("dragstart", function (event) {
        event.dataTransfer.setData("text/plain", tr.dataset.id);
        event.dataTransfer.effectAllowed = "move";
      });
      tr.addEventListener("dragover", function (event) {
        event.preventDefault();
        tr.classList.add("drop-target");
      });
      tr.addEventListener("dragleave", function () { tr.classList.remove("drop-target"); });
      tr.addEventListener("drop", function (event) {
        event.preventDefault();
        tr.classList.remove("drop-target");
        var source = null;
        var id = event.dataTransfer.getData("text/plain");
        tr.parentElement.querySelectorAll("tr[data-id]").forEach(function (row) {
          if (row.dataset.id === id) source = row;
        });
        if (!source || source === tr) return;
        var rect = tr.getBoundingClientRect();
        var after = event.clientY > rect.top + rect.height / 2;
        tr.parentElement.insertBefore(source, after ? tr.nextElementSibling : tr);
        syncCardOrder(tr.closest("section"));
        markDirty();
      });
    }

    function ensureAddButtons() {
      ["representative", "staff", "company"].forEach(function (id) {
        var tbody = document.querySelector("#" + id + " tbody");
        if (!tbody || tbody.querySelector("tr.add-row")) return;
        var row = document.createElement("tr");
        row.className = "add-row";
        var cell = document.createElement("td");
        cell.colSpan = 4;
        cell.append(button("add-video", "＋ 動画を追加", function () { addBlank(id); }));
        row.append(cell);
        tbody.append(row);
      });
    }

    function addBlank(category) {
      var id = "row-" + Date.now();
      MenuKit.addItem({
        id: id,
        category: category,
        name: "新しい動画",
        description: "",
        duration: "2〜3分",
        interview: "",
        workplace: ""
      });
      var tr = null;
      document.querySelectorAll("#" + category + " tbody tr[data-id]").forEach(function (row) {
        if (row.dataset.id === id) tr = row;
      });
      if (!tr) return;
      var add = document.querySelector("#" + category + " tr.add-row");
      if (add) add.before(tr);
      enhanceRow(tr);
      tr.scrollIntoView({ block: "center" });
      beginEdit(tr.querySelector(".name"), "name");
      markDirty();
    }

    function start(html, data) {
      var style = (html.match(/<style>([\s\S]*?)<\/style>/) || [])[1] || "";
      var main = (html.match(/<main class="sheet">[\s\S]*?<\/main>/) || [])[0] || "";
      var stage = document.getElementById("stage");
      if (!style || !main) {
        stage.textContent = "料金表の読み込みに失敗しました。";
        return;
      }
      var previewStyle = document.createElement("style");
      previewStyle.textContent = style;
      document.head.append(previewStyle, document.getElementById("overrides"));
      stage.innerHTML = main;
      Object.keys(data.videos || {}).forEach(function (name) {
        tracked[name] = true;
        state.videos[name] = data.videos[name] || "";
      });
      MenuKit.apply(data);
      eachMenuRow(function (tr) { enhanceRow(tr); });
      ensureAddButtons();
      savedRaw = rawSnapshot();
      markDirty();
    }

    Promise.all([
      fetch("index.html?t=" + Date.now(), { cache: "no-store" }).then(function (response) { return response.text(); }),
      fetch("menu.json?t=" + Date.now(), { cache: "no-store" }).then(function (response) {
        return response.ok ? response.json() : { videos: {}, items: [] };
      })
    ]).then(function (pair) {
      start(pair[0], pair[1]);
    }).catch(function () {
      document.getElementById("stage").textContent = "料金表の読み込みに失敗しました。";
    });
  </script>
</body>
